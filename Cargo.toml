[workspace]
resolver = "2"
members = ["crates/osi-types", "crates/godot-osi", "crates/esmini-rm"]
# In-repo worktrees are independent checkouts; keep them out of this workspace.
exclude = ["worktrees"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GT-karny/Godot-OSI-plugin"

# Optimize release builds of the native plugin.
[profile.release]
opt-level = 3
lto = "thin"
