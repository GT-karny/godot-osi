name: release

# Fires when you push a version tag, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags:
      - "v*"
  # Allows a manual run from the Actions tab (produces artifacts, no release).
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: godot_osi.dll
            built_path: target/release/godot_osi.dll
          - os: ubuntu-latest
            platform: linux
            artifact: libgodot_osi.so
            built_path: target/release/libgodot_osi.so
          - os: macos-latest
            platform: macos
            artifact: libgodot_osi.dylib
            built_path: target/release/libgodot_osi.dylib
    steps:
      # submodules: true (not recursive) fetches external/esmini, whose
      # RoadManager is statically linked into the extension. esmini's own
      # externals/fmt is initialized (shallow) by esmini-rm/build.rs at build
      # time, and we skip its large test-scenario submodules.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # esmini's RoadManager is built from source via CMake + a C++ compiler.
      # All three GitHub runners ship CMake and a C++ toolchain, so no extra
      # install is needed here.

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # protoc is provided by the `protoc-bin-vendored` build-dependency,
      # so no system protoc install is required.
      # Windows/Linux: single-arch build into target/release/.
      - name: Build (release)
        if: matrix.platform != 'macos'
        run: cargo build --release -p godot-osi

      # macOS: build both arches and lipo them into a universal dylib so the
      # x86_64 + arm64 entries in godot_osi.gdextension are both honored.
      - name: Build universal (macOS)
        if: matrix.platform == 'macos'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release -p godot-osi --target x86_64-apple-darwin
          cargo build --release -p godot-osi --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/x86_64-apple-darwin/release/libgodot_osi.dylib \
            target/aarch64-apple-darwin/release/libgodot_osi.dylib \
            -output target/release/libgodot_osi.dylib
          lipo -info target/release/libgodot_osi.dylib

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.built_path }}
          if-no-files-found: error

      # build.rs emits the schema doc into packaging/generated/ during the build
      # above. It's OS-independent, so we only grab it from the linux job.
      - name: Upload schema doc
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: schema
          path: packaging/generated/SCHEMA.md
          if-no-files-found: error

  package:
    name: package & release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble addon
        run: |
          ADDON="dist/addons/godot_osi"
          mkdir -p "$ADDON/bin/windows" "$ADDON/bin/linux" "$ADDON/bin/macos"
          mkdir -p "$ADDON/third_party/osi3"

          # Binaries
          cp artifacts/windows/godot_osi.dll      "$ADDON/bin/windows/"
          cp artifacts/linux/libgodot_osi.so      "$ADDON/bin/linux/"
          cp artifacts/macos/libgodot_osi.dylib   "$ADDON/bin/macos/"

          # Distribution gdextension + notices (runtime-only addon: no plugin.cfg)
          cp packaging/godot_osi.gdextension      "$ADDON/"
          cp packaging/THIRD_PARTY_NOTICES.md     "$ADDON/"

          # Docs: usage + node API + OpenDRIVE road API (hand-written) +
          # schema (auto-generated by build.rs)
          cp packaging/README.md packaging/API.md packaging/ROADS.md "$ADDON/"
          cp artifacts/schema/SCHEMA.md           "$ADDON/"

          # Licenses (own code) + bundled MPL source (OSI .proto)
          cp LICENSE-MIT LICENSE-APACHE           "$ADDON/"
          cp proto/osi3/LICENSE                   "$ADDON/third_party/osi3/"
          cp proto/osi3/*.proto                   "$ADDON/third_party/osi3/"

      - name: Zip (no examples)
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cd dist
          zip -r "../godot-osi-${VERSION}.zip" addons
          cd ..

      - name: Add examples and zip (with examples)
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          ADDON="dist/addons/godot_osi"
          mkdir -p "$ADDON/examples"
          # Scripts ship as-is; the .tscn uses the packaged res:// path.
          cp godot/examples/osi_pipeline.gd       "$ADDON/examples/"
          cp godot/examples/osi_visual_demo.gd    "$ADDON/examples/"
          cp packaging/examples/osi_visual_demo.tscn "$ADDON/examples/"
          # Sample OpenDRIVE maps so the road demo/quickstart runs out of the box.
          mkdir -p "$ADDON/examples/roads"
          cp godot/examples/roads/*.xodr          "$ADDON/examples/roads/"
          cd dist
          zip -r "../godot-osi-${VERSION}-examples.zip" addons
          cd ..
          ls -la *.zip

      - name: Upload artifact (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: godot-osi-addon
          path: "*.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
