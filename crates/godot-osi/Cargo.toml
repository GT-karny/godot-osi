[package]
name = "godot-osi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Godot 4 GDExtension: receive ASAM OSI over gRPC and expose it to Godot."

[lib]
crate-type = ["cdylib"]

[features]
# Compiles `OsiTestRig` (a debug GodotClass that builds sample OSI frames and
# loads real .osi traces) so a headless Godot project can validate the generated
# convert_* output. Off by default to keep test scaffolding out of shipped
# builds. See crates/godot-osi/itest/README.md.
itest = []

[dependencies]
godot = "0.5.3"
osi-types = { path = "../osi-types" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "macros", "time"] }
# TLS features enable `ClientTlsConfig` for REQUIREMENTS §4 (TLS is non-default in tonic 0.14).
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots"] }
# `ReceiverStream` for the bundled mock gRPC server's streaming responses (§6).
tokio-stream = "0.1"
# Encode/decode OSI frames for `.osi` trace record/replay and the itest trace rig
# (osi3 types impl `prost::Message`).
prost = "0.14.3"

# Used by build.rs (converter): drive a vendored protoc to emit a
# FileDescriptorSet, then decode it with prost-types to walk the OSI schema and
# generate the typed Godot `Resource` classes.
[build-dependencies]
protoc-bin-vendored = "3.2.0"
prost = "0.14.3"
prost-types = "0.14.3"
